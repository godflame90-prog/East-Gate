<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a New Password — East Gate Platform</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="images/EastGate-core.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    rel="stylesheet">

  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/portals.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body data-portal-chrome="off">

  <main class="auth-page">
    <div class="auth-shell">

      <div class="auth-brand">
        <a href="index.html" class="brand" aria-label="East Gate — back to home">
          <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 21V10.5a8 8 0 0 1 16 0V21" />
            <path d="M9 21v-10a3 3 0 0 1 6 0v10" />
            <path d="M2.5 21h19" />
          </svg>
          <span class="brand__name">EAST<span>·</span>GATE</span>
        </a>
      </div>

      <section class="auth-card" id="resetCard">
        <header class="auth-head">
          <h1 class="auth-title">Choose a new password</h1>
          <p class="auth-sub">At least 10 characters, and not one you have used before.</p>
        </header>

        <div class="auth-alert" id="resetAlert" role="alert" aria-live="polite">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7.5v5.5" />
            <path d="M12 16.4h.01" />
          </svg>
          <span id="resetAlertText"></span>
        </div>

        <form id="resetForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="newPassword">New password</label>
            <div class="auth-field has-reveal" id="passwordField">
              <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="4.5" y="10.5" width="15" height="9.5" rx="2" />
                <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7" />
              </svg>
              <input type="password" class="form-input" id="newPassword" name="password" placeholder="At least 10 characters"
                autocomplete="new-password" required>
              <button type="button" class="auth-reveal" id="togglePassword" aria-label="Show password"
                aria-pressed="false">
                <svg id="toggleIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z" />
                  <circle cx="12" cy="12" r="2.9" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm new password</label>
            <div class="auth-field">
              <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="4.5" y="10.5" width="15" height="9.5" rx="2" />
                <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7" />
              </svg>
              <input type="password" class="form-input" id="confirmPassword" name="confirm"
                placeholder="Re-enter your password" autocomplete="new-password" required>
            </div>
          </div>

          <button type="submit" class="btn btn--gold auth-submit">
            <span id="resetSubmitLabel">Update password</span>
          </button>
        </form>

        <div class="auth-alert auth-alert--ok" id="resetDone" role="status" aria-live="polite" hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21c4-3 7-6.2 7-10a7 7 0 1 0-14 0c0 3.8 3 7 7 10Z" />
            <path d="m9 11.5 2 2 4-4" />
          </svg>
          <span id="resetDoneText"></span>
          <br>
          <a href="login.html" class="btn btn--gold auth-submit" style="margin-top:16px;text-decoration:none;">Sign in
            now</a>
        </div>

        <p class="auth-foot">
          Link expired?
          <a href="forgot-password.html">Request a new one</a>
        </p>
      </section>

      <a href="index.html" class="auth-back">&#8592; Back to East Gate</a>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var params = new URLSearchParams(window.location.search);
      var token = (params.get('token') || '').trim();

      var card = document.getElementById('resetCard');
      var form = document.getElementById('resetForm');
      var alertBox = document.getElementById('resetAlert');
      var alertText = document.getElementById('resetAlertText');
      var doneBox = document.getElementById('resetDone');
      var doneText = document.getElementById('resetDoneText');
      var submitBtn = document.querySelector('#resetForm .btn');
      var submitLabel = document.getElementById('resetSubmitLabel');
      var passwordInput = document.getElementById('newPassword');
      var confirmInput = document.getElementById('confirmPassword');

      if (!token) {
        // No token in the URL — the reset flow cannot start. Saving this page
        // without the link is the most common way to end up here.
        form.remove();
        card.querySelector('.auth-head .auth-title').textContent = 'Invalid reset link';
        card.querySelector('.auth-head .auth-sub').textContent =
          'This page needs the link from the email you were sent. Request a new one below.';
        document.querySelector('.auth-foot a').href = 'forgot-password.html';
        return;
      }

      function showError(message) {
        doneBox.hidden = true;
        alertText.textContent = message;
        alertBox.classList.add('is-visible');
      }

      function showDone() {
        alertBox.classList.remove('is-visible');
        form.remove();
        doneText.textContent = 'Your password has been updated and every old session was signed out.';
        doneBox.hidden = false;
        localStorage.removeItem('east_gate_email');
      }

      function setBusy(busy) {
        submitBtn.disabled = busy;
        submitLabel.textContent = busy ? 'Updating…' : 'Update password';
      }

      var toggle = document.getElementById('togglePassword');
      var toggleIcon = document.getElementById('toggleIcon');
      var EYE = '<path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.9"/>';
      var EYE_OFF = '<path d="M9.9 5.9A9.8 9.8 0 0 1 12 5.8c6 0 9.5 6.2 9.5 6.2a17 17 0 0 1-3.3 4"/><path d="M6.4 7.6A17.2 17.2 0 0 0 2.5 12S6 18.2 12 18.2c1.3 0 2.5-.3 3.6-.8"/><path d="m3 3 18 18"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';

      toggle.addEventListener('click', function () {
        var revealed = passwordInput.type === 'text';
        passwordInput.type = revealed ? 'password' : 'text';
        toggle.setAttribute('aria-pressed', String(!revealed));
        toggle.setAttribute('aria-label', revealed ? 'Show password' : 'Hide password');
        toggleIcon.innerHTML = revealed ? EYE : EYE_OFF;
        passwordInput.focus();
      });

      passwordInput.addEventListener('input', function () { alertBox.classList.remove('is-visible'); });
      confirmInput.addEventListener('input', function () { alertBox.classList.remove('is-visible'); });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var password = passwordInput.value;

        if (password.length < 10) {
          showError('Passwords must be at least 10 characters.');
          passwordInput.focus();
          return;
        }
        if (password !== confirmInput.value) {
          showError('The two passwords do not match.');
          confirmInput.focus();
          return;
        }

        setBusy(true);
        window.EastGateAPI.resetPassword(token, password).then(function (result) {
          setBusy(false);
          if (!result.success) {
            showError(result.error);
            return;
          }
          showDone();
        }).catch(function () {
          setBusy(false);
          showError('Cannot reach the East Gate server. Start it with "npm run dev" and try again.');
        });
      });
    });
  </script>

</body>

</html>
