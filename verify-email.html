<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm Your Email — East Gate Platform</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="images/EastGate-core.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    rel="stylesheet">

  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/portals.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body data-portal-chrome="off">

  <main class="auth-page">
    <div class="auth-shell">

      <div class="auth-brand">
        <a href="index.html" class="brand" aria-label="East Gate — back to home">
          <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 21V10.5a8 8 0 0 1 16 0V21" />
            <path d="M9 21v-10a3 3 0 0 1 6 0v10" />
            <path d="M2.5 21h19" />
          </svg>
          <span class="brand__name">EAST<span>·</span>GATE</span>
        </a>
      </div>

      <section class="auth-card">
        <header class="auth-head">
          <h1 class="auth-title" id="verifyTitle">Checking your link…</h1>
          <p class="auth-sub" id="verifySub">Confirming your email address with East Gate.</p>
        </header>

        <div class="auth-alert auth-alert--ok" id="verifyOk" role="status" aria-live="polite" hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21c4-3 7-6.2 7-10a7 7 0 1 0-14 0c0 3.8 3 7 7 10Z" />
            <path d="m9 11.5 2 2 4-4" />
          </svg>
          <span id="verifyOkText"></span>
          <br>
          <a href="login.html" class="btn btn--gold auth-submit" style="margin-top:16px;text-decoration:none;">Go to sign
            in</a>
        </div>

        <div class="auth-alert" id="verifyBad" role="alert" aria-live="polite" hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7.5v5.5" />
            <path d="M12 16.4h.01" />
          </svg>
          <span id="verifyBadText"></span>
        </div>

        <div id="verifyActions" hidden>
          <button type="button" id="resendBtn" class="btn btn--ghost" style="width:100%;">
            Resend verification link
          </button>
        </div>

        <p class="auth-foot">
          <a href="login.html">Sign in</a> &nbsp;·&nbsp;
          <a href="register.html">Create an account</a>
        </p>
      </section>

      <a href="index.html" class="auth-back">&#8592; Back to East Gate</a>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var params = new URLSearchParams(window.location.search);
      var token = (params.get('token') || '').trim();

      var title = document.getElementById('verifyTitle');
      var sub = document.getElementById('verifySub');
      var okBox = document.getElementById('verifyOk');
      var okText = document.getElementById('verifyOkText');
      var badBox = document.getElementById('verifyBad');
      var badText = document.getElementById('verifyBadText');
      var actions = document.getElementById('verifyActions');
      var resendBtn = document.getElementById('resendBtn');

      function showOk(message) {
        badBox.hidden = true;
        actions.hidden = true;
        title.textContent = 'Email confirmed';
        sub.textContent = 'Your address is verified. You are all set.';
        okText.textContent = message;
        okBox.hidden = false;
      }

      function showBad(message, resendable, immediate) {
        okBox.hidden = true;
        title.textContent = immediate ? 'Verification failed' : 'Link unavailable';
        sub.textContent = immediate
          ? 'The link did not work.'
          : 'This page is reached by clicking the link in the email we sent you.';
        badText.textContent = message;
        badBox.hidden = false;
        actions.hidden = !resendable;
      }

      if (!token) {
        showBad('No verification token was found.', false, false);
        return;
      }

      window.EastGateAPI.verifyEmail(token).then(function (result) {
        if (result.success) {
          showOk(result.message);
          return;
        }
        showBad(result.error, true, true);
      }).catch(function () {
        showBad('Cannot reach the East Gate server. Please try again in a moment.', true, true);
      });

      resendBtn.addEventListener('click', function () {
        resendBtn.disabled = true;
        resendBtn.textContent = 'Sending…';
        window.EastGateAPI.resendVerification().then(function (result) {
          resendBtn.textContent = result.success ? 'Sent — check your inbox' : 'Try again';
          resendBtn.disabled = !result.success;
          if (!result.success) {
            badText.textContent = result.error;
          }
        }).catch(function () {
          resendBtn.textContent = 'Try again';
          resendBtn.disabled = false;
        });
      });
    });
  </script>

</body>

</html>
