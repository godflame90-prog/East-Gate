<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password — East Gate Platform</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="images/EastGate-core.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    rel="stylesheet">

  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/portals.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body data-portal-chrome="off">

  <main class="auth-page">
    <div class="auth-shell">

      <div class="auth-brand">
        <a href="index.html" class="brand" aria-label="East Gate — back to home">
          <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 21V10.5a8 8 0 0 1 16 0V21" />
            <path d="M9 21v-10a3 3 0 0 1 6 0v10" />
            <path d="M2.5 21h19" />
          </svg>
          <span class="brand__name">EAST<span>·</span>GATE</span>
        </a>
      </div>

      <section class="auth-card">
        <header class="auth-head">
          <h1 class="auth-title">Reset your password</h1>
          <p class="auth-sub">Enter the email address for your account and we will send a reset link.</p>
        </header>

        <div class="auth-alert" id="resetAlert" role="alert" aria-live="polite">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7.5v5.5" />
            <path d="M12 16.4h.01" />
          </svg>
          <span id="resetAlertText"></span>
        </div>

        <form id="forgotForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="forgotEmail">Email address</label>
            <div class="auth-field">
              <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="m3.5 7 8.5 6 8.5-6" />
              </svg>
              <input type="email" class="form-input" id="forgotEmail" name="email" placeholder="you@example.com"
                autocomplete="email" spellcheck="false" required>
            </div>
          </div>

          <button type="submit" class="btn btn--gold auth-submit" id="forgotSubmitBtn">
            <span id="forgotSubmitLabel">Send reset link</span>
          </button>
        </form>

        <div class="auth-alert auth-alert--ok" id="forgotSent" role="status" aria-live="polite" hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21c4-3 7-6.2 7-10a7 7 0 1 0-14 0c0 3.8 3 7 7 10Z" />
            <path d="m9 11.5 2 2 4-4" />
          </svg>
          <span id="forgotSentText"></span>
          <br>
          <a href="login.html" class="auth-link">&#8592; Back to sign in</a>
        </div>

        <p class="auth-foot">
          Remembered it?
          <a href="login.html">Sign in</a> &nbsp;·&nbsp;
          <a href="register.html">Create an account</a>
        </p>
      </section>

      <a href="index.html" class="auth-back">&#8592; Back to East Gate</a>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var form = document.getElementById('forgotForm');
      var emailInput = document.getElementById('forgotEmail');
      var submitBtn = document.getElementById('forgotSubmitBtn');
      var submitLabel = document.getElementById('forgotSubmitLabel');
      var alertBox = document.getElementById('resetAlert');
      var alertText = document.getElementById('resetAlertText');
      var sentBox = document.getElementById('forgotSent');
      var sentText = document.getElementById('forgotSentText');

      // Pre-fill with whatever the login page carried over.
      var params = new URLSearchParams(window.location.search);
      var prefill = params.get('email');
      if (prefill && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(prefill)) {
        emailInput.value = prefill;
      }

      function showError(message) {
        sentBox.hidden = true;
        alertText.textContent = message;
        alertBox.classList.add('is-visible');
      }

      function findStep() {
        var params = new URLSearchParams(window.location.search);
        var step = params.get('step');
        return step === 'sent' ? 'sent' : 'form';
      }

      function showSent() {
        alertBox.classList.remove('is-visible');
        form.hidden = true;
        sentText.textContent =
          'Check your inbox (and spam folder). The link works for 30 minutes.';
        sentBox.hidden = false;
        history.replaceState(null, '', window.location.pathname + '?step=sent');
      }

      function setBusy(busy) {
        submitBtn.disabled = busy;
        submitLabel.textContent = busy ? 'Sending…' : 'Send reset link';
      }

      // Landing straight on the sent state (e.g. after a reload) is fine.
      if (findStep() === 'sent') showSent();

      emailInput.addEventListener('input', function () {
        alertBox.classList.remove('is-visible');
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = emailInput.value.trim();

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError('Enter a valid email address.');
          emailInput.focus();
          return;
        }

        setBusy(true);
        window.EastGateAPI.forgotPassword(email).then(function (result) {
          setBusy(false);
          if (!result.success) {
            showError(result.error);
            return;
          }
          showSent();
        }).catch(function () {
          setBusy(false);
          showError('Cannot reach the East Gate server. Start it with "npm run dev" and try again.');
        });
      });
    });
  </script>

</body>

</html>
