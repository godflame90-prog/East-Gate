databases:
  - name: east-gate-db
    databaseName: eastgate
    user: eastgate
    plan: free
    region: oregon

services:
  - type: web
    name: east-gate
    runtime: node
    plan: free
    branch: master
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /robots.txt
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Provisioned by the database block above; Render injects its connection
      # string here. Point this at Neon manually instead if you prefer.
      - key: DATABASE_URL
        fromDatabase:
          name: east-gate-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SEED_PASSWORD
        sync: false
      # Set to the public Render URL once the first deploy is live, so emailed
      # reset/verify links (and canonical/OG/sitemap URLs) resolve.
      - key: APP_BASE_URL
        sync: false
